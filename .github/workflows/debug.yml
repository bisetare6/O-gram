name: Debug build

on:
  workflow_dispatch:

jobs:
  build-all:
    name: Unified O-gram Build
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Extra Swap & System Tools
        run: |
          set -e
          sudo fallocate -l 4G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=4096
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra || true
          sudo apt-get update
          sudo apt-get install -y yasm nasm ninja-build python3 unzip file

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          set -e
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          echo "y" | sdkmanager --install "cmake;3.22.1" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null || true
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties

      - name: Grant File Permissions
        run: |
          set -e
          chmod +x run gradlew || true
          find TMessagesProj/jni -name "*.sh" -exec chmod +x {} + || true

      - name: Show build environment
        run: |
          set -e
          java -version || true
          sdkmanager --version || true
          ls -la
          ls -la TMessagesProj || true
          test -f TMessagesProj/build.gradle && echo "TMessagesProj/build.gradle exists" || echo "TMessagesProj/build.gradle missing"

      - name: Build Native Libraries
        run: |
          set -e
          cd TMessagesProj/jni
          ./patch_boringssl.sh
          cd ../..
          ./run init action boringssl
          ./run init libs boringssl
          ./run init action ffmpeg
          ./run init libs libvpx
          ./run init libs dav1d
          ./run init libs ffmpeg

      - name: List native libs before Gradle build
        run: |
          set -e
          echo "== TMessagesProj/src/main/libs =="
          find TMessagesProj/src/main/libs -type f \( -name "*.so" -o -name "*.a" \) -print | sort || true
          echo "== Important native build outputs =="
          find TMessagesProj/.cxx TMessagesProj/build -type f -name "*.so" -print | sort || true

      - name: Verify local O-gram branding
        run: |
          set -e
          echo "Checking branding..."
          grep -q ">O-gram</string>" TMessagesProj/src/main/res/values/strings_nekox.xml || { echo "ERROR: strings_nekox.xml does not contain O-gram label"; exit 1; }
          grep -q 'gramName = "O-gram"' TMessagesProj/build.gradle || { echo "ERROR: build.gradle gramName is not O-gram"; exit 1; }
          grep -q "universalApk true" TMessagesProj/build.gradle || { echo "ERROR: universalApk true not found in build.gradle"; exit 1; }
          echo "Branding check passed."

      - name: Patch signing and build properties
        run: |
          set -e
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' TMessagesProj/build.gradle || true
          sed -i -E 's|^[[:space:]]*//[[:space:]]*(include[[:space:]].*)$|\1|g' settings.gradle || true
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties || true
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          echo "local.properties:"
          cat local.properties
          echo "settings.gradle after safe uncomment:"
          cat settings.gradle

      - name: Build O-gram APK
        env:
          NATIVE_TARGET: ""
        run: |
          set -e
          ./gradlew :TMessagesProj:assembleDebug -x test -x lint --stacktrace --no-daemon

      - name: Inspect APK ABI contents
        if: always()
        run: |
          set -e
          echo "APK files produced:"
          find TMessagesProj/build/outputs/apk -type f -name "*.apk" -print | sort || true
          find TMessagesProj/build/outputs/apk -type f -name "*.apk" -print0 | while IFS= read -r -d '' apk; do
            echo "===== APK: $apk ====="
            unzip -l "$apk" | grep -E "lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/" || echo "No native libs found"
          done

      - name: Validate libtmessages presence
        if: always()
        run: |
          set -e
          fail_file=$(mktemp)
          echo 0 > "$fail_file"
          apk_count=0

          while IFS= read -r -d '' apk; do
            apk_count=$((apk_count+1))
            echo "Checking $apk"
            if ! unzip -l "$apk" | grep -Eq "lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/libtmessages.*\.so"; then
              echo "ERROR: $apk does not contain libtmessages.so"
              echo 1 > "$fail_file"
            fi
          done < <(find TMessagesProj/build/outputs/apk -type f -name "*.apk" -print0)

          if [ "$apk_count" -eq 0 ]; then
            echo "No APK files found."
            exit 1
          fi

          if [ "$(cat "$fail_file")" = "1" ]; then
            echo "At least one APK is missing libtmessages.so. Native build/packaging is broken."
            exit 1
          fi

          echo "All produced APKs contain libtmessages.so."

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: O-gram-Debug-APKs
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            build/outputs/apk/**/*.apk
