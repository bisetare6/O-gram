name: Debug build

on:
  workflow_dispatch:

jobs:
  build-all:
    name: Unified O-gram Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Extra Swap & System Tools
        run: |
          sudo fallocate -l 4G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=4096
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          sudo apt-get update
          sudo apt-get install -y yasm nasm ninja-build python3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties

      - name: Grant File Permissions
        run: |
          chmod +x run gradlew
          find TMessagesProj/jni -name "*.sh" -exec chmod +x {} + || true

      - name: Build BoringSSL & FFmpeg
        run: |
          cd TMessagesProj/jni
          ./patch_boringssl.sh
          cd ../..
          ./run init action boringssl
          ./run init libs boringssl
          ./run init action ffmpeg
          ./run init libs libvpx
          ./run init libs dav1d
          ./run init libs ffmpeg

      - name: Build Native Telegram Core (libtmessages.49.so)
        run: |
          # ساخت مستقیم موتور تلگرام برای معماری ۳۲ بیتی شبیه‌ساز LDPlayer
          export NATIVE_TARGET="armeabi-v7a"
          ./run libs native
          
          # ساخت مستقیم موتور تلگرام برای معماری ۶۴ بیتی گوشی‌های مدرن
          export NATIVE_TARGET="arm64-v8a"
          ./run libs native

      - name: Direct Identity Rebrand
        run: |
          # تغییر نام نمایشی در تمام سطوح
          sed -i 's/>Nagram</>O-gram</g' TMessagesProj/src/main/res/values/strings.xml || true
          sed -i 's/>Telegram</>O-gram</g' TMessagesProj/src/main/res/values/strings.xml || true
          sed -i 's/<string name="AppName"[^>]*>.*<\/string>/<string name="AppName" translatable="false">O-gram<\/string>/g' TMessagesProj/src/main/res/values/strings.xml || true
          sed -i 's/<string name="AppNameBeta"[^>]*>.*<\/string>/<string name="AppNameBeta" translatable="false">O-gram<\/string>/g' TMessagesProj/src/main/res/values/strings.xml || true
          sed -i 's/android:label="@string\/AppName"/android:label="O-gram"/g' TMessagesProj/src/main/AndroidManifest.xml || true

      - name: Patch Signing & Properties
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' TMessagesProj/build.gradle || true
          echo "RELEASE_STORE_FILE=" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=android" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=androiddebugkey" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=android" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          sed -i 's/\/\///g' settings.gradle
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Build O-gram APK
        run: ./gradlew :TMessagesProj:assembleDebug -x test -x lint -PoverrideSigning=debug --stacktrace

      - name: Upload Verified APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: O-gram-Working-APK
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            build/outputs/apk/**/*.apk
