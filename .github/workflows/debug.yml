name: Debug build

on:
  workflow_dispatch:

jobs:
  build-all:
    name: Unified O-gram Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm ninja-build python3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties

      - name: Grant File Permissions
        run: |
          chmod +x run gradlew
          find TMessagesProj/jni -name "*.sh" -exec chmod +x {} + || true

      - name: Native Build Cache
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg/build
            TMessagesProj/jni/boringssl/build
            TMessagesProj/src/main/libs
          key: native-libs-cache-v2

      - name: Build Native Libraries (If not cached)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          cd TMessagesProj/jni
          ./patch_boringssl.sh
          cd ../..
          ./run init action boringssl
          ./run init libs boringssl
          ./run init action ffmpeg
          ./run init libs libvpx
          ./run init libs dav1d
          ./run init libs ffmpeg

      - name: Clean Rebrand to O-gram
        run: |
          # تغییر نام فقط در فایل مرجع اصلی بدون دستکاری فایل‌های زبان‌های دیگر
          sed -i 's/>Nagram</>O-gram</g' TMessagesProj/src/main/res/values/strings.xml
          sed -i 's/>Telegram</>O-gram</g' TMessagesProj/src/main/res/values/strings.xml
          sed -i 's/<string name="AppName".*<\/string>/<string name="AppName" translatable="false">O-gram<\/string>/g' TMessagesProj/src/main/res/values/strings.xml
          sed -i 's/<string name="AppNameBeta".*<\/string>/<string name="AppNameBeta" translatable="false">O-gram<\/string>/g' TMessagesProj/src/main/res/values/strings.xml

      - name: Enable Universal APK & Patch Signing
        run: |
          # فعال‌سازی ساخت APK فراگیر و پشتیبانی از LDPlayer
          sed -i 's/universalApk false/universalApk true/g' TMessagesProj/build.gradle || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' TMessagesProj/build.gradle || true
          
          echo "RELEASE_STORE_FILE=" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=android" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=androiddebugkey" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=android" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          sed -i 's/\/\///g' settings.gradle
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Build O-gram APK
        run: ./gradlew :TMessagesProj:assembleDebug -x test -x lint -PoverrideSigning=debug --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: O-gram-Debug-APKs
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            build/outputs/apk/**/*.apk
