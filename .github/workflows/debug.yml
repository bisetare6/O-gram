name: Debug build

on:
  workflow_dispatch:

jobs:
  build-all:
    name: Unified O-gram Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm ninja-build python3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties

      - name: Grant File Permissions
        run: |
          chmod +x run gradlew
          find TMessagesProj/jni -name "*.sh" -exec chmod +x {} + || true

      - name: Build Native BoringSSL
        run: |
          cd TMessagesProj/jni
          ./patch_boringssl.sh
          cd ../..
          ./run init action boringssl
          ./run init libs boringssl

      - name: Build Native FFmpeg
        run: |
          ./run init action ffmpeg
          ./run init libs libvpx
          ./run init libs dav1d
          ./run init libs ffmpeg

      - name: Configure Gradle Environment
        run: |
          sed -i 's/\/\///g' settings.gradle
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Build O-gram APK
        run: ./gradlew :TMessagesProj:assembleDebug -x test -x lint --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: O-gram-Debug-APK
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            build/outputs/apk/**/*.apk
